name: Validate Website and CMS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wijana-playschool.css'
      - 'hatchable/**'
      - 'database/migrations/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-website-cms
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website entry point and design asset
        run: |
          test -s index.html
          test -s wijana-playschool.css
          grep -q '<html lang="id">' index.html
          grep -q 'KB/TK WIJANA SEJATI' index.html
          grep -q 'wijana-playschool.css' index.html
      - name: Validate CMS endpoint syntax
        run: |
          node --input-type=module --check < hatchable/api/public-cms.js
          node --input-type=module --check < hatchable/api/admin-cms.js
      - name: Validate PostgreSQL migration presence
        run: |
          test -s database/migrations/0002_school_cms_core.sql
          grep -q 'CREATE TABLE IF NOT EXISTS cms_content' database/migrations/0002_school_cms_core.sql
          grep -q 'CREATE TABLE IF NOT EXISTS cms_audit_log' database/migrations/0002_school_cms_core.sql
