name: Deploy Website Sekolah

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'wijana-playschool.css'
      - 'docs/**'
      - 'database/migrations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate website entry point
        run: |
          test -s index.html
          test -s wijana-playschool.css
          grep -q '<html lang="id">' index.html
          grep -q 'KB/TK WIJANA SEJATI' index.html
          grep -q 'wijana-playschool.css' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
